<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="day.css">
</head>
<body>
  <h1>Know The Day</h1>
  <div class="inputs">
    <input id="date" class="input" type="text" placeholder="date:">
    
    <select id="month" class="input" name="month">
       <option value="" selected disabled>Month:</option>
      <option value="11">January</option>
      <option value="12">February</option>
      <option value="1">March</option>
      <option value="2">April</option>
      <option value="3">May</option>
      <option value="4">June</option>
      <option value="5">July</option>
      <option value="6">August</option>
      <option value="7">September</option>
      <option value="8">October</option>
      <option value="9">November</option>
      <option value="10">December</option>
    </select>
    
    <input id="year" class="input" type="text" placeholder="year:">
    
  </div>
  
  <button id="find" class="buttons">Find the Day</button>
  <button id="clear" class="buttons">Clear</button>
  
  <div id="result" class="result">
    <span id="day">---</span>
  </div>
  
  <script src="day.js"></script>
</body>
</html>
