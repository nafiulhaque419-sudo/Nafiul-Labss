<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="business.css">
</head>
  <body>
    <h1>Business Calculator</h1>
    
    <div class="tabs">
      <div class="profitTab active tab">Profit/Loss</div>
      <div class="discountTab tab">Discount</div>
      <div class="gstTab tab">GST</div>
    </div>
    
    <div class="inputs">
      <div class="profit-loss active-module">
        <input id="CP" type="text" placeholder="Cost Price: ">
        <input id="SP_pl" type="text" placeholder="Selling Price: ">
        <input id="profit" type="text" placeholder="Profit: ">
        <input id="loss" type="text" placeholder="Loss: ">
        <input id="profit_per" type="text" placeholder="Profit%:">
        <input id="loss_per" type="text" placeholder="Loss%:">
      </div>
        
      <div class="discount">
        <input id="MP" type="text" placeholder="Marked Price: ">
        <input id="SP_dis" type="text" placeholder="Selling Price: ">
        <input id="dis" type="text" placeholder="Discount:">
        <input id="dis_per" type="text" placeholder="Discount%:">
      </div>
      
      <div class="GST">
        <input id="OP" type="text" placeholder="Original Price: ">
        <input id="FP" type="text" placeholder="Final Price: ">
        <input id="gst" type="text" placeholder="GST:">
        <input id="gst_per" type="text" placeholder="GST%:">
      </div>
    </div>
    <div class="buttons">
      <button id="calculate">Calculate</button>
      <button id="clear">Clear</button>
    </div>
    <script src="business.js"></script>
  </body>
</html>
